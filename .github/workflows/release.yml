# Public repo only: build the Windows installer for a version tag and publish it as a GitHub Release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*'] # semver tags only

permissions:
  contents: write

jobs:
  windows:
    if: github.repository == 'ToxicFrame-WF/ToxicFrame'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: warframe-tracker/package-lock.json

      - name: Build helper
        shell: bash
        working-directory: helper
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: Set version from tag
        shell: bash
        working-directory: warframe-tracker
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installer
        shell: bash
        working-directory: warframe-tracker
        run: |
          npm ci
          npm test
          npm run build:win

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # tags like v0.1.0-beta.1 are published as pre-releases; a re-pushed tag replaces the installer on its existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" warframe-tracker/dist/ToxicFrame-Setup-*.exe --clobber
          else
            gh release create "$TAG" warframe-tracker/dist/ToxicFrame-Setup-*.exe --title "ToxicFrame $TAG" --generate-notes $([[ "$TAG" == *-* ]] && echo --prerelease)
          fi
