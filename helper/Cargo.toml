[package]
name = "toxicframe-helper"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tf-scan"
path = "src/bin/tf-scan.rs"

[[bin]]
name = "tf-helper"
path = "src/bin/tf-helper.rs"

[dependencies]
memchr = "2"
serde_json = "1"
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
